# C interface to the spicy crate in the parent directory, used from PrivateDrop's Swift code
# the empty [workspace] keeps this a separate workspace from the parent crate
[package]
name = "spicy-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C ABI wrapper around the SPICy PSI protocol for PrivateDrop"
publish = false

[workspace]

[lib]
name = "spicy_ffi"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "spicy-precompute"
path = "src/bin/spicy_precompute.rs"

[dependencies]
spicy = { path = ".." }
# spicy wic, exported as spicy_wic_*
spicy-ws = { path = "../spicy-wic" }
sha2 = "0.10"
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
zeroize = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

